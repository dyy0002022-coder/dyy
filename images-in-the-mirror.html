(()=>{const gate=document.getElementById('project-intro'),intro=document.getElementById('intro-video'),enter=document.getElementById('enter-project'),start=document.getElementById('intro-start'),status=document.getElementById('intro-status'),content=document.getElementById('project-content'),lightbox=document.getElementById('device-video-lightbox'),large=lightbox.querySelector('video'),caption=lightbox.querySelector('p');let opened=false;
const ended=()=>{enter.hidden=false;status.textContent='先导片已播放完毕 · 点击进入项目'};intro.addEventListener('ended',ended);const auto=intro.play();if(auto)auto.catch(()=>{start.hidden=false;status.textContent='点击开始播放项目先导片。播放结束后即可进入项目。'});start.addEventListener('click',()=>{start.hidden=true;intro.play().catch(()=>{start.hidden=false})});
const pages=[...content.querySelectorAll('.source-pages figure')],bar=content.querySelector('.source-progress span'),count=content.querySelector('.source-progress small');let io;
function update(){const max=document.documentElement.scrollHeight-innerHeight,progress=max>0?scrollY/max:1;bar.style.transform='scaleX('+Math.max(0,Math.min(1,progress))+')';let current=0;for(let i=0;i<pages.length;i++)if(pages[i].getBoundingClientRect().top<innerHeight*.58)current=i;count.textContent=String(current+1).padStart(2,'0')+' / '+String(pages.length).padStart(2,'0')}
