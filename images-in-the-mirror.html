(()=>{const pages=[...document.querySelectorAll('.source-pages figure')],filmDialog=document.getElementById('project-film-dialog'),film=document.getElementById('project-film-video'),caption=document.getElementById('film-caption'),buttons=[...document.querySelectorAll('.device-video-trigger')];if(!pages.length)return;document.body.classList.add('scroll-ready');const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;pages[0].classList.add('is-visible');if(reduced)pages.forEach(p=>p.classList.add('is-visible'));else{const pageObserver=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('is-visible');pageObserver.unobserve(e.target)}}),{rootMargin:'0px 0px -8% 0px',threshold:.04});pages.forEach(p=>pageObserver.observe(p))}
function previewFor(btn){const v=btn.querySelector('video');if(!v.src){v.src=v.dataset.source;v.load()}return v}

const filmFrame = document.getElementById('mirror-film-frame');
const openingVideo = document.getElementById('mirror-opening-video');

function showExhibition(moveFocus) {
  if (filmFrame.hidden) return;
  const bounds = filmFrame.getBoundingClientRect();
  const filmInView = bounds.bottom > 0 && bounds.top < window.innerHeight;
  openingVideo.pause();
  document.getElementById('mirror-project-pages').hidden = false;
  document.getElementById('contact').hidden = false;
  filmFrame.hidden = true;
  if (moveFocus) cover.focus({preventScroll: true});
  if (moveFocus || filmInView) cover.scrollIntoView({block: 'start'});
}

const openingSource = openingVideo.querySelector('source');

</script><script id="mirror-stills-loop">
(() => {
  const strip = document.querySelector('#mirror-stills');
  const viewport = strip.querySelector('.mirror-strip-viewport');
  const track = strip.querySelector('.mirror-strip-track');
  const tile = track.firstElementChild;
  const controls = strip.querySelector('.mirror-strip-controls');
  const play = strip.querySelector('[data-play]');
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
  const repeat = tile.cloneNode(true);
  repeat.setAttribute('aria-hidden', 'true');
  repeat.querySelector('img').alt = '';
  track.append(repeat);
  controls.hidden = false;

  let width = 0;
  let offset = 0;
  let drag;
  let visible = false;
  let paused = reducedMotion.matches;
  let time = 0;
  let frame = 0;

  function render() {
    if (!width) return;
    offset = ((offset % width) + width) % width;
    track.style.transform = 'translateX(' + (-offset) + 'px)';
  }
  function tick(now) {
    frame = 0;
    if (time) {
      offset += Math.min(now - time, 50) * .034;
      render();
    }
    time = now;
    sync();
  }
  function sync() {
    const animate = visible && !paused && !drag && !document.hidden;
    if (animate && !frame) frame = requestAnimationFrame(tick);
    if (!animate) {
      cancelAnimationFrame(frame);
      frame = 0;
      time = 0;
    }
  }
  function updatePause() {
    play.textContent = paused ? '播放' : '暂停';
    play.setAttribute('aria-pressed', String(paused));
    sync();
  }
  new ResizeObserver(() => {
    const nextWidth = tile.getBoundingClientRect().width;
    if (nextWidth && width) offset *= nextWidth / width;
    width = nextWidth;
    render();
  }).observe(tile);
  new IntersectionObserver(([entry]) => {
    visible = entry.isIntersecting;
    sync();
  }).observe(viewport);
  document.addEventListener('visibilitychange', sync);
  reducedMotion.addEventListener('change', ({ matches }) => {
    paused = matches;
    updatePause();
  });
  play.addEventListener('click', () => {
    paused = !paused;
    updatePause();
  });
  controls.querySelectorAll('[data-step]').forEach(button => {
    button.addEventListener('click', () => {
      offset += Math.min(width / 5, viewport.clientWidth * .8) * Number(button.dataset.step);
      render();
    });
  });
  viewport.addEventListener('pointerdown', event => {
    if (!event.isPrimary || event.button !== 0) return;
    drag = { id: event.pointerId, x: event.clientX, offset };
    viewport.setPointerCapture(event.pointerId);
    viewport.classList.add('is-dragging');
    sync();
  });
  viewport.addEventListener('pointermove', event => {
    if (drag?.id !== event.pointerId) return;
    offset = drag.offset + drag.x - event.clientX;
    render();
  });
  function stopDrag(event) {
    if (drag?.id !== event.pointerId) return;
    drag = undefined;
    viewport.classList.remove('is-dragging');
    sync();
  }
  viewport.addEventListener('pointerup', stopDrag);
  viewport.addEventListener('pointercancel', stopDrag);
  viewport.addEventListener('lostpointercapture', stopDrag);
  updatePause();
})();
</script></body></html>
